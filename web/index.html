  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2f5bea"/>
                <stop offset="1" stop-color="#6f9bff"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="46" height="46" rx="14" fill="url(#brandGrad)"/>
            <rect x="1" y="1" width="46" height="46" rx="14" fill="none" stroke="rgba(255,255,255,.18)"/>
            <path d="M13 11h9v26h-6V17H13z" fill="#fff"/>
            <path d="M22 11h9.5a7 7 0 0 1 0 14H22z" fill="#fff"/>
            <rect x="25" y="14" width="6" height="8" rx="1" fill="#2f5bea"/>
            <rect x="13" y="31" width="6" height="6" fill="#ffb23f"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">PCL</span>
          <span class="brand-sub">PCL Launcher</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="主导航">
        <button class="nav-item" data-route="home"><span class="nav-icon" data-icon="home"></span><span class="nav-label">主页</span></button>
        <button class="nav-item" data-route="download"><span class="nav-icon" data-icon="download"></span><span class="nav-label">下载</span></button>
        <button class="nav-item" data-route="versions"><span class="nav-icon" data-icon="layers"></span><span class="nav-label">版本管理</span></button>
        <button class="nav-item" data-route="resources"><span class="nav-icon" data-icon="package"></span><span class="nav-label">资源</span><span class="nav-dot"></span></button>
        <button class="nav-item" data-route="servers"><span class="nav-icon" data-icon="server"></span><span class="nav-label">服务器</span></button>
        <button class="nav-item" data-route="toolbox"><span class="nav-icon" data-icon="wrench"></span><span class="nav-label">工具箱</span></button>
        <button class="nav-item" data-route="settings"><span class="nav-icon" data-icon="sliders"></span><span class="nav-label">设置</span></button>
        <button class="nav-item" data-route="about"><span class="nav-icon" data-icon="info"></span><span class="nav-label">关于</span></button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="account" id="account" title="切换账户">
        <div class="avatar" id="avatar" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <rect width="32" height="32" rx="9" fill="#24324a"/>
            <rect x="6" y="5" width="20" height="7" fill="#86c76a"/>
            <rect x="6" y="5" width="20" height="15" fill="#5a9be0"/>
            <rect x="9" y="12" width="5" height="4" fill="#f6f8ff"/>
            <rect x="18" y="12" width="5" height="4" fill="#f6f8ff"/>
            <rect x="10" y="13" width="3" height="2" fill="#1d2a3d"/>
            <rect x="19" y="13" width="3" height="2" fill="#1d2a3d"/>
            <rect x="11" y="22" width="10" height="3" rx="1.5" fill="#f0c49b"/>
            <rect x="12" y="22" width="8" height="2" fill="#7a4a33"/>
          </svg>
        </div>
        <div class="account-text">
          <strong id="accountName">Steve</strong>
          <span id="accountType">离线账户 · 点击切换</span>
        </div>
      </div>
      <div class="side-chip" id="sideArch"><span class="dot"></span>本机环境</div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">主页</h1>
          <span class="page-sub" id="pageSub">欢迎回来</span>
        </div>
        <div class="topbar-meta" id="topbarMeta"></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="logBtn" title="启动日志" aria-label="启动日志"><span data-icon="terminal"></span></button>
          <button class="icon-btn" id="refreshBtn" title="刷新状态" aria-label="刷新状态"><span data-icon="refresh"></span></button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </section>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
