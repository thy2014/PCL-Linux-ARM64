name: Build Linux ARM64 packages

on:
  push:
    branches: [main]
    paths:
      - "pcl.py"
      - "pcl_core/**"
      - "web/**"
      - "packaging/linux/**"
      - "tools/build_single.py"
      - ".github/workflows/linux-arm64.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install GTK/WebKit build runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-soup-2.4
          sudo apt-get install -y gir1.2-webkit2-4.1 || sudo apt-get install -y gir1.2-webkit2-4.0
      - name: Install PyInstaller and pywebview in a venv
        run: |
          python3 -m venv --system-site-packages /tmp/pcl-build-venv
          . /tmp/pcl-build-venv/bin/activate
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyinstaller pywebview
      - name: Build bundled-Python executable and packages
        run: |
          . /tmp/pcl-build-venv/bin/activate
          bash packaging/linux/build_pyinstaller.sh
      - name: Commit Linux artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add pcl-single.py dist/PCL-Launcher_1.0.0_arm64.deb dist/PCL-Launcher_1.0.0_linux_arm64.tar.gz
          if git diff --cached --quiet; then
            echo "No Linux artifact changes"
          else
            git commit -m "build: Linux ARM64 bundled-Python packages"
            git push
          fi
