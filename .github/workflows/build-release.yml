name: Build release artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync current desktop-window source
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/rphHwpTt9S" -o /tmp/pcl-src.tar.gz
          tar -xzf /tmp/pcl-src.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
          mkdir -p web/assets
          cp packaging/linux/pcl-launcher.png web/assets/app.png
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "chore: sync desktop-window source"
            git push
          fi

  windows:
    needs: sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize source line endings
        shell: pwsh
        run: |
          python -c "from pathlib import Path; [p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n')) for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.py', '.js', '.css', '.html', '.json', '.txt', '.md', '.svg', '.desktop'}]"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build single-file exe
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet pyinstaller pywebview playwright
          ./packaging/windows/build.ps1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force dist\windows\PCL-Launcher.exe dist\PCL-Launcher.exe
      - name: Install headless browser
        shell: pwsh
        run: python -m playwright install chromium
      - name: Capture Windows UI
        shell: pwsh
        run: |
          $data = Join-Path $env:TEMP "pcl-ci-data"
          $game = Join-Path $env:TEMP "pcl-ci-game"
          Remove-Item -Recurse -Force $data, $game -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\dist\PCL-Launcher.exe" -ArgumentList "--no-window", "--no-browser", "--port", "3990", "--data-dir", $data, "--game-dir", $game -PassThru
          Start-Sleep -Seconds 5
          python packaging/windows/capture-windows.py
          Get-Process PCL-Launcher -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Commit exe and screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/PCL-Launcher.exe docs/screenshots
          if git diff --cached --quiet; then
            echo "No Windows artifact changes"
          else
            git commit -m "build: Windows single-file exe"
            git push
          fi

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install window shell
        run: python -m pip install --disable-pip-version-check --quiet pywebview
      - name: Build Linux ARM64 packages
        run: bash packaging/linux/build_deb.sh
      - name: Commit packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pcl-single.py dist/PCL-Launcher_1.0.0_arm64.deb dist/PCL-Launcher_1.0.0_linux_arm64.tar.gz
          if git diff --cached --quiet; then
            echo "No Linux artifact changes"
          else
            git commit -m "build: Linux ARM64 installer packages"
            git push
          fi
